name: Update trail status

# Reads the official open/closed list at 09:00 and 14:00 Madeira time and publishes status.json on the
# "status" branch, which the app reads from:
# https://raw.githubusercontent.com/Psy8891/Madeira-Trails-/status/status.json
# The branch always holds a single commit, so it never grows.

on:
  workflow_dispatch:
  schedule:
    # 09:00 and 14:00 in Madeira (owner's choice, 26 Oct 2026). Cron runs in UTC and Madeira
    # moves between UTC (winter) and UTC+1 (summer), so both pairs are listed and the `slot` job
    # skips the pair that doesn't match today's offset. Best effort: GitHub may delay or drop
    # scheduled runs; the app treats status older than 24 h as unknown, so a missed run never
    # shows a wrong "open".
    # GitHub often drops or delays runs at the top of the hour, so each slot has a second try
    # half an hour later; it is skipped when the first one already published.
    - cron: "3,33 9,14 * * *"   # winter (WET, UTC+0)
    - cron: "3,33 8,13 * * *"   # summer (WEST, UTC+1)

permissions:
  contents: write

concurrency:
  group: update-status
  cancel-in-progress: false

jobs:
  slot:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      run: ${{ steps.slot.outputs.run }}
    steps:
      - name: Only at 09:00 and 14:00 Madeira time, once per slot
        id: slot
        env:
          SCHEDULE: ${{ github.event.schedule }}
          GH_TOKEN: ${{ github.token }}
        run: |
          offset=$(TZ=Atlantic/Madeira date +%z)
          run=yes
          if [ -n "$SCHEDULE" ]; then
            if [ "$offset" = "+0000" ] && [ "$SCHEDULE" != "3,33 9,14 * * *" ]; then run=no; fi
            if [ "$offset" = "+0100" ] && [ "$SCHEDULE" != "3,33 8,13 * * *" ]; then run=no; fi
            # The half-past try only runs when the first one didn't publish in the last 2 hours.
            last=$(gh api "repos/${{ github.repository }}/commits/status" --jq .commit.committer.date 2>/dev/null || echo "")
            if [ "$run" = yes ] && [ -n "$last" ]; then
              age=$(( $(date -u +%s) - $(date -u -d "$last" +%s) ))
              if [ "$age" -lt 7200 ]; then run=no; echo "Status published ${age}s ago."; fi
            fi
          fi
          echo "Madeira offset $offset, schedule '${SCHEDULE:-manual}', run=$run"
          echo "run=$run" >> "$GITHUB_OUTPUT"

  status:
    needs: slot
    if: needs.slot.outputs.run == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r data/requirements.txt

      - name: Get the previous status
        run: |
          mkdir -p out
          if git fetch --depth 1 origin status 2>/dev/null; then
            git show FETCH_HEAD:status.json > previous.json || true
          fi

      - name: Read the official status
        run: |
          python data/scripts/build_status.py \
            --out out/status.json \
            --previous previous.json \
            --debug-out out/rows.txt
          {
            echo "## Trail status"
            echo '```'
            cat out/rows.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish to the status branch
        run: |
          cd out
          git init -q -b status
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status.json rows.txt
          git commit -q -m "Trail status $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" status
