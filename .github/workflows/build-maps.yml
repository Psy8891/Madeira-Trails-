name: Build offline maps

# Builds the offline map package for Madeira and Porto Santo (spec: Phase 1, build-maps) and the
# elevation grid bundled in the app:
#   - madeira-base.pmtiles      OpenMapTiles vector tiles from the OSM extract (Planetiler)
#   - madeira-contours.pmtiles  10 m contours from the DROTe terrain model (GDAL + tippecanoe)
#   - madeira-dem.pmtiles       Terrarium terrain tiles for hillshade (data/scripts/build_dem_tiles.py)
#   - app/src/main/assets/elevation.bin, overview.pmtiles (z0–10) and glyphs/ (committed to main,
#     then an APK build starts)
# The files go to the release maps-YYYY.MM.DD; manifest.json goes to the release maps-latest,
# which the app reads.

on:
  workflow_dispatch:
  # A push to the maps-build branch builds a test package (release maps-test) without touching
  # main or maps-latest.
  push:
    branches: [maps-build]
  schedule:
    - cron: "17 4 3 * *" # monthly, after the weekly catalog update has refreshed the extract

permissions:
  contents: write

concurrency:
  group: build-maps
  cancel-in-progress: false

env:
  BBOX: "-17.30,32.55,-16.25,33.15"
  MADEIRA_WCS: https://geoservices.madeira.gov.pt/geoserver/EL_modelodigitalterreno_madeira10m/wcs
  MADEIRA_COVERAGE: EL_modelodigitalterreno_madeira10m__el_mdtmadeira_gridcoverage
  PORTOSANTO_WCS: https://geoservices.madeira.gov.pt/geoserver/EL_mdt_portosanto10m/wcs
  PORTOSANTO_COVERAGE: EL_mdt_portosanto10m__MDT_PortoSanto_2007_10m

jobs:
  maps:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        # Every step's output also goes to build.log, shown as an annotation if the job fails.
        shell: bash -eo pipefail {0}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install tools
        run: |
          exec > >(tee -a "$RUNNER_TEMP/build.log") 2>&1
          sudo apt-get -qq update
          sudo apt-get -qq install -y gdal-bin python3-gdal python3-numpy build-essential libsqlite3-dev zlib1g-dev >/dev/null
          pip install -q -r data/requirements-maps.txt
          git clone -q --depth 1 https://github.com/felt/tippecanoe.git /tmp/tippecanoe
          make -C /tmp/tippecanoe -j4 >/dev/null 2>&1
          sudo make -C /tmp/tippecanoe install >/dev/null
          tippecanoe --version
          gdalinfo --version

      - name: Version
        id: version
        run: |
          exec > >(tee -a "$RUNNER_TEMP/build.log") 2>&1
          echo "version=$(date -u +%Y.%m.%d)" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = push ]; then echo "test=true" >> "$GITHUB_OUTPUT"; else echo "test=false" >> "$GITHUB_OUTPUT"; fi

      - name: Download the terrain models (DROTe, WCS)
        run: |
          exec > >(tee -a "$RUNNER_TEMP/build.log") 2>&1
          bash data/scripts/fetch_dtm.sh work

      - name: Elevation grid for the app
        run: |
          exec > >(tee -a "$RUNNER_TEMP/build.log") 2>&1
          mkdir -p out
          gdalwarp -q -overwrite -t_srs EPSG:4326 -tr 0.00025 0.00025 -te -17.28 32.62 -16.62 32.89 \
            -r average -ot Int16 -dstnodata -32768 -of ENVI work/madeira.tif work/madeira-grid.bil
          gdalwarp -q -overwrite -t_srs EPSG:4326 -tr 0.00025 0.00025 -te -16.43 32.99 -16.26 33.13 \
            -r average -ot Int16 -dstnodata -32768 -of ENVI work/portosanto.tif work/portosanto-grid.bil
          python data/scripts/build_elevation.py work/madeira-grid.bil work/portosanto-grid.bil \
            --out app/src/main/assets/elevation.bin | tee work/elevation.txt
          echo "::notice title=Elevation grid::$(tr '\n' ' ' < work/elevation.txt)"

      - name: Terrain tiles
        run: |
          exec > >(tee -a "$RUNNER_TEMP/build.log") 2>&1
          python data/scripts/build_dem_tiles.py work/madeira.tif work/portosanto.tif \
            --bbox="$BBOX" --minzoom 8 --maxzoom 14 --out out/madeira-dem.pmtiles

      - name: Contours
        run: |
          exec > >(tee -a "$RUNNER_TEMP/build.log") 2>&1
          mkdir -p out
          for island in madeira portosanto; do
            # Contours from a lightly smoothed 20 m copy: smoother lines, a third of the data.
            gdalwarp -q -overwrite -tr 20 20 -r cubicspline -srcnodata -9999 -dstnodata -9999 \
              "work/$island.tif" "work/$island-20m.tif"
            gdal_contour -q -i 10 -a ele -f GPKG "work/$island-20m.tif" "work/$island-contours.gpkg"
            ogr2ogr -q -f GeoJSONSeq -t_srs EPSG:4326 -dialect SQLite \
              -sql "SELECT CAST(ele AS INTEGER) AS ele, CASE WHEN CAST(ele AS INTEGER) % 50 = 0 THEN 1 ELSE 0 END AS idx, geom FROM contour WHERE ele > 0" \
              "work/$island-contours.geojsons" "work/$island-contours.gpkg"
          done
          tippecanoe -q -o out/madeira-contours.pmtiles -l contour -Z11 -z14 \
            -j '{"*":["any",[">=","$zoom",13],["==","idx",1]]}' \
            --simplification=2 --drop-densest-as-needed --no-tile-size-limit --force \
            --attribution="Terrain © DROTe" \
            work/madeira-contours.geojsons work/portosanto-contours.geojsons
          ls -la out

      - name: Base map (Planetiler, OpenMapTiles)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          exec > >(tee -a "$RUNNER_TEMP/build.log") 2>&1
          gh release download osm-extract -p madeira.osm.pbf -D work --clobber
          curl -sSL -o work/planetiler.jar https://github.com/onthegomap/planetiler/releases/latest/download/planetiler.jar
          (cd work && java -Xmx6g -jar planetiler.jar --osm-path=madeira.osm.pbf --download \
            --bounds="$BBOX" --maxzoom=14 --output=../out/madeira-base.pmtiles --force)
          # The small overview map shipped in the app (spec: Offline maps), never blank offline.
          (cd work && java -Xmx6g -jar planetiler.jar --osm-path=madeira.osm.pbf \
            --bounds="$BBOX" --maxzoom=10 --output=../app/src/main/assets/overview.pmtiles --force)
          ls -la out app/src/main/assets/overview.pmtiles

      - name: Fonts for the offline style
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          exec > >(tee -a "$RUNNER_TEMP/build.log") 2>&1
          gh release download v2.0 --repo openmaptiles/fonts -p noto-sans.zip -D work --clobber
          unzip -q -o work/noto-sans.zip -d work/fonts
          for style in Regular Bold Italic; do
            dir="app/src/main/assets/glyphs/NotoSans-$style"
            rm -rf "$dir" && mkdir -p "$dir"
            for range in 0-255 256-511 8192-8447; do
              cp "work/fonts/Noto Sans $style/$range.pbf" "$dir/"
            done
          done
          du -sh app/src/main/assets/glyphs

      - name: Manifest
        run: |
          exec > >(tee -a "$RUNNER_TEMP/build.log") 2>&1
          v=${{ steps.version.outputs.version }}
          echo "::notice title=Sizes::$(ls -la out app/src/main/assets/overview.pmtiles | awk '{print $5, $9}' | tr '\n' ' ')"
          python data/scripts/build_manifest.py --version "$v" \
            --base-url "https://github.com/${{ github.repository }}/releases/download/maps-$v" \
            --out out/manifest.json \
            base=out/madeira-base.pmtiles contours=out/madeira-contours.pmtiles dem=out/madeira-dem.pmtiles
          cat out/manifest.json >> "$GITHUB_STEP_SUMMARY"

      - name: Publish a test package
        if: steps.version.outputs.test == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          exec > >(tee -a "$RUNNER_TEMP/build.log") 2>&1
          gh release view maps-test >/dev/null 2>&1 || gh release create maps-test --prerelease --title "Offline maps: test build" --notes "Built from the maps-build branch for checking; the app doesn't read it."
          gh release upload maps-test out/madeira-base.pmtiles out/madeira-contours.pmtiles out/madeira-dem.pmtiles out/manifest.json app/src/main/assets/elevation.bin app/src/main/assets/overview.pmtiles --clobber
          tar -czf out/glyphs.tgz -C app/src/main/assets glyphs
          gh release upload maps-test out/glyphs.tgz --clobber

      - name: Publish the package
        if: steps.version.outputs.test == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          exec > >(tee -a "$RUNNER_TEMP/build.log") 2>&1
          v=${{ steps.version.outputs.version }}
          notes="Offline map package for Madeira and Porto Santo. Map data © OpenStreetMap contributors (ODbL), tiles built with Planetiler (OpenMapTiles schema). Terrain © DROTe, Região Autónoma da Madeira."
          gh release view "maps-$v" >/dev/null 2>&1 || gh release create "maps-$v" --prerelease --title "Offline maps $v" --notes "$notes"
          gh release upload "maps-$v" out/madeira-base.pmtiles out/madeira-contours.pmtiles out/madeira-dem.pmtiles --clobber
          gh release view maps-latest >/dev/null 2>&1 || gh release create maps-latest --prerelease --title "Offline maps: latest manifest" --notes "manifest.json points at the current package."
          gh release upload maps-latest out/manifest.json --clobber

      - name: Commit the elevation grid and fonts
        id: commit
        if: steps.version.outputs.test == 'false'
        run: |
          exec > >(tee -a "$RUNNER_TEMP/build.log") 2>&1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/elevation.bin app/src/main/assets/overview.pmtiles app/src/main/assets/glyphs
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update the elevation grid and map fonts"
            git pull --rebase origin main
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build a new APK
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run android-ci.yml --ref main

      - name: Show the end of the log
        if: failure()
        run: |
          tail -n 30 "$RUNNER_TEMP/build.log" | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' > "$RUNNER_TEMP/tail.txt" || true
          echo "::error title=build-maps log::$(cat "$RUNNER_TEMP/tail.txt")"
