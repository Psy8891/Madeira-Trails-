name: Probe DEM sources (temporary)
on:
  push:
    branches: [probe-dem]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Probe
        run: |
          mkdir -p probe
          {
            for ws in EL_mdt_madeira10m EL_mdt_madeira EL_mdt_madeira5m EL_mdt_madeira_10m EL_mdt_portosanto5m EL_mdt_portosanto10m EL EL_mdt; do
              echo "== $ws"
              curl -sS -m 60 "https://geoservices.madeira.gov.pt/geoserver/$ws/ows?service=WCS&version=2.0.1&request=GetCapabilities" -o "wcs_$ws.xml" -w "%{http_code} %{size_download}\n" || true
              grep -o '<wcs:CoverageId>[^<]*' "wcs_$ws.xml" | head || true
              grep -o 'ExceptionText>[^<]*' "wcs_$ws.xml" | head -2 || true
              curl -sS -m 60 "https://geoservices.madeira.gov.pt/geoserver/$ws/wms?service=WMS&version=1.3.0&request=GetCapabilities" -o "wms_$ws.xml" -w "wms %{http_code} %{size_download}\n" || true
              grep -o '<Name>[^<]*' "wms_$ws.xml" | head -5 || true
            done
                    } > probe/out.txt 2>&1
          for f in wcs_*.xml; do head -c 100000 "$f" > "probe/$f"; done
      - name: Save
        run: |
          git config user.name probe; git config user.email probe@example.invalid
          git add probe && git commit -qm "probe output" && git push -q origin HEAD:probe-dem
