name: Update trail catalog

# Rebuilds app/src/main/assets/catalog.json from OpenStreetMap, commits it if it changed,
# and starts a new app build so the release APK carries the new trails.
# Source: the Geofabrik extract of Portugal clipped to Madeira; the public Overpass servers are
# only a fallback because they ask automated jobs not to rely on them.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC

permissions:
  contents: write
  actions: write

concurrency:
  group: update-catalog
  cancel-in-progress: false

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r data/requirements.txt

      - name: Download the OpenStreetMap extract
        id: extract
        continue-on-error: true
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q osmium-tool
          curl -sSfL --retry 3 -o portugal.osm.pbf https://download.geofabrik.de/europe/portugal-latest.osm.pbf
          ls -lh portugal.osm.pbf
          osmium extract -b -17.30,32.55,-16.25,33.15 portugal.osm.pbf -o madeira.osm.pbf --overwrite
          ls -lh madeira.osm.pbf

      # The clipped extract (about 10 MB, ODbL) is kept on a release so the catalog can be rebuilt
      # and debugged elsewhere with the same data.
      - name: Publish the Madeira extract
        if: steps.extract.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view osm-extract >/dev/null 2>&1 || gh release create osm-extract --prerelease \
            --title "OpenStreetMap extract of Madeira" \
            --notes "Geofabrik Portugal extract clipped to Madeira and Porto Santo with osmium. © OpenStreetMap contributors, ODbL 1.0. Rebuilt by the Update trail catalog workflow."
          gh release upload osm-extract madeira.osm.pbf --clobber

      - name: Build catalog from OpenStreetMap
        run: |
          if [ -f madeira.osm.pbf ] && python data/scripts/build_catalog.py --pbf madeira.osm.pbf; then
            echo "Built from the Geofabrik extract."
          else
            echo "::warning title=Catalog::Extract not usable, asking Overpass instead"
            python data/scripts/build_catalog.py
          fi

      - name: Report
        run: cat data/catalog-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/catalog.json app/src/main/assets/network.bin data/catalog-report.md
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Catalog unchanged."
          else
            git commit -m "Update trail catalog from OpenStreetMap"
            # main may have moved on while the job ran.
            git pull --rebase origin main
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Pushes made with the workflow token don't start other workflows, so start the app build here.
      - name: Build a new APK
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run android-ci.yml --ref main
