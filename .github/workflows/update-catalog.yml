name: Update trail catalog

# Rebuilds app/src/main/assets/catalog.json from OpenStreetMap, commits it if it changed,
# and starts a new app build so the release APK carries the new trails.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC

permissions:
  contents: write
  actions: write

concurrency:
  group: update-catalog
  cancel-in-progress: false

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r data/requirements.txt

      - name: Build catalog from OpenStreetMap
        run: python data/scripts/build_catalog.py

      - name: Report
        run: cat data/catalog-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/catalog.json data/catalog-report.md
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Catalog unchanged."
          else
            git commit -m "Update trail catalog from OpenStreetMap"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Pushes made with the workflow token don't start other workflows, so start the app build here.
      - name: Build a new APK
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run android-ci.yml --ref main
