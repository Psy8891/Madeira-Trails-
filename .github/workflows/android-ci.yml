name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run unit tests
        run: ./gradlew test --stacktrace

      - name: Test summary
        if: always()
        run: |
          python3 - <<'EOF'
          import glob, os, xml.etree.ElementTree as ET

          rows, total, failed, skipped = [], 0, 0, 0
          for path in sorted(glob.glob("**/build/test-results/**/TEST-*.xml", recursive=True)):
              suite = ET.parse(path).getroot()
              tests = int(suite.get("tests", 0))
              fails = int(suite.get("failures", 0)) + int(suite.get("errors", 0))
              skips = int(suite.get("skipped", 0))
              total, failed, skipped = total + tests, failed + fails, skipped + skips
              rows.append(f"| {suite.get('name')} | {tests} | {fails} | {skips} |")
              # One annotation per failing test, so the reason shows without opening the logs.
              for case in suite.iter("testcase"):
                  for problem in list(case.findall("failure")) + list(case.findall("error")):
                      message = (problem.get("message") or problem.text or "").replace("\n", " ")[:400]
                      print(f"::error title=Test failed::{case.get('classname')} > {case.get('name')}: {message}")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write("## Unit tests\n\n| Suite | Tests | Failed | Skipped |\n| --- | --- | --- | --- |\n")
              out.write("\n".join(rows))
              out.write(f"\n| **Total** | **{total}** | **{failed}** | **{skipped}** |\n")

          print(f"::notice title=Unit tests::{total} tests, {failed} failed, {skipped} skipped")
          if total == 0:
              print("::error title=Unit tests::No test results found - the tests did not run")
              raise SystemExit(1)
          EOF

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: vereda-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore

  data-tests:
    name: Data job tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r data/requirements.txt

      - name: Run tests
        run: python -m pytest data/tests -q

  publish:
    name: Publish APK to the latest-debug release
    needs: [build, data-tests]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download APK
        uses: actions/download-artifact@v7
        with:
          name: vereda-debug-apk
          path: apk

      - name: Replace the latest-debug release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp apk/*.apk vereda-debug.apk
          cat > notes.md <<EOF
          Debug build #${GITHUB_RUN_NUMBER} from commit ${GITHUB_SHA::7}, built and tested by CI.

          **Install on Android:** download \`vereda-debug.apk\` below on the phone, open it, and allow
          installs from your browser when asked. Newer builds install over older ones.
          EOF
          gh release delete latest-debug --yes --cleanup-tag || true
          gh release create latest-debug vereda-debug.apk \
            --prerelease \
            --target "${GITHUB_SHA}" \
            --title "Latest debug build (#${GITHUB_RUN_NUMBER})" \
            --notes-file notes.md
