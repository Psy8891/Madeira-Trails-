name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run unit tests
        run: ./gradlew test --stacktrace

      - name: Test summary
        if: always()
        run: |
          python3 - <<'EOF'
          import glob, os, xml.etree.ElementTree as ET

          rows, total, failed, skipped = [], 0, 0, 0
          for path in sorted(glob.glob("**/build/test-results/**/TEST-*.xml", recursive=True)):
              suite = ET.parse(path).getroot()
              tests = int(suite.get("tests", 0))
              fails = int(suite.get("failures", 0)) + int(suite.get("errors", 0))
              skips = int(suite.get("skipped", 0))
              total, failed, skipped = total + tests, failed + fails, skipped + skips
              rows.append(f"| {suite.get('name')} | {tests} | {fails} | {skips} |")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write("## Unit tests\n\n| Suite | Tests | Failed | Skipped |\n| --- | --- | --- | --- |\n")
              out.write("\n".join(rows))
              out.write(f"\n| **Total** | **{total}** | **{failed}** | **{skipped}** |\n")

          print(f"::notice title=Unit tests::{total} tests, {failed} failed, {skipped} skipped")
          if total == 0:
              print("::error title=Unit tests::No test results found - the tests did not run")
              raise SystemExit(1)
          EOF

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: vereda-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore
