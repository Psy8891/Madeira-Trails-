<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Navigate — PR 6</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#1F5F3F}a:hover{color:#174A31}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F3F0E6; font-family: Inter, system-ui, sans-serif; color: #17201B">
  <div style="position: absolute; left: 0; top: 0">
    <dc-import name="TopoMap" vb="0 -30 390 844" w="390" h="844" mode="navigate" me="{{yes}}" hint-size="390px,844px"></dc-import>
  </div>

  <section aria-label="Route progress" style="position: absolute; left: 12px; right: 12px; top: 12px; background: #FFFFFF; border-radius: 18px; box-shadow: 0 4px 18px rgba(23,32,27,0.18); padding: 14px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; gap: 8px">
      <span style="display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 8px; border: 1px solid #D8D4C8; border-radius: 6px; font: 700 13px 'Barlow Semi Condensed', Inter, sans-serif"><span style="display: inline-flex; flex-direction: column; width: 4px"><span style="height: 5px; background: #F2C200; display: block"></span><span style="height: 5px; background: #D32F2F; display: block"></span></span>PR 6</span>
      <span style="flex: 1 1 auto; font: 600 18px 'Barlow Semi Condensed', Inter, sans-serif">Levada das 25 Fontes</span>
      <a href="Trail.dc.html" style="font-size: 13px; font-weight: 600">Details</a>
    </div>
    <div style="height: 6px; border-radius: 3px; background: #ECE9E1; overflow: hidden"><div style="width: 37%; height: 6px; background: #D81B60"></div></div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <div style="display: flex; flex-direction: column"><span style="font: 700 22px 'Barlow Semi Condensed', Inter, sans-serif">2.7 km</span><span style="font-size: 11.5px; color: #4E5A53">to 25 Fontes</span></div>
      <div style="display: flex; flex-direction: column"><span style="font: 700 22px 'Barlow Semi Condensed', Inter, sans-serif">↓ 124 m</span><span style="font-size: 11.5px; color: #4E5A53">descent left</span></div>
      <div style="display: flex; flex-direction: column"><span style="font: 700 22px 'Barlow Semi Condensed', Inter, sans-serif">~1 h 50</span><span style="font-size: 11.5px; color: #4E5A53">at your pace</span></div>
    </div>
    <div role="status" style="display: flex; align-items: center; gap: 8px; padding-top: 8px; border-top: 1px solid #ECE9E1; font-size: 12.5px; color: #3E4842">
      <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#2E9E5B"></circle><path d="M7 12l3.5 3.5L17 9" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      <span><strong style="color: #17201B">On route</strong> · alerts if you stray more than 40 m</span>
    </div>
  </section>

  <div style="position: absolute; left: 16px; top: 206px; display: flex; flex-direction: column; gap: 8px">
    <a href="Layers.dc.html" aria-label="Map layers" style="width: 44px; height: 44px; border-radius: 12px; background: #FFFFFF; box-shadow: 0 2px 10px rgba(23,32,27,0.16); display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#17201B" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5 9-5z"></path><path d="M3 13l9 5 9-5"></path></svg>
    </a>
    <button aria-label="Emergency: call 112 and share location" style="width: 44px; height: 44px; border: 0; border-radius: 12px; background: #FFFFFF; box-shadow: 0 2px 10px rgba(23,32,27,0.16); display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#B42318" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-0.7-8-4.5-8-9V6l8-3z"></path><path d="M12 8v5M12 16v0.5"></path></svg>
    </button>
  </div>

  <section aria-label="Recording" style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-radius: 22px 22px 0 0; box-shadow: 0 -6px 24px rgba(23,32,27,0.16); padding: 10px 16px 20px; display: flex; flex-direction: column; gap: 14px">
    <div style="width: 36px; height: 4px; border-radius: 2px; background: #D5D1C6; align-self: center"></div>
    <div style="display: flex; align-items: center; justify-content: space-between">
      <span style="display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; color: #C2410C"><span style="width: 10px; height: 10px; border-radius: 5px; background: #C2410C; display: block"></span>Recording</span>
      <span style="font-size: 12px; color: #4E5A53">GPS ±4 m · Battery 86% · Sunset 18:41</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px">
      <div style="display: flex; flex-direction: column"><span style="font: 700 34px/1 'Barlow Semi Condensed', Inter, sans-serif">0:44:10</span><span style="font-size: 12px; color: #4E5A53">Moving time</span></div>
      <div style="display: flex; flex-direction: column"><span style="font: 700 34px/1 'Barlow Semi Condensed', Inter, sans-serif">1.6 km</span><span style="font-size: 12px; color: #4E5A53">Distance</span></div>
      <div style="display: flex; flex-direction: column"><span style="font: 600 24px/1.1 'Barlow Semi Condensed', Inter, sans-serif">1,148 m</span><span style="font-size: 12px; color: #4E5A53">Altitude</span></div>
      <div style="display: flex; flex-direction: column"><span style="font: 600 24px/1.1 'Barlow Semi Condensed', Inter, sans-serif">↑ 12 m · ↓ 138 m</span><span style="font-size: 12px; color: #4E5A53">Climb and descent</span></div>
    </div>
    <div style="display: flex; gap: 10px; align-items: center">
      <button aria-label="Add waypoint" style="width: 56px; height: 56px; flex: 0 0 auto; border: 1px solid #DDD8CC; border-radius: 16px; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#17201B" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s7-6.2 7-11.5A7 7 0 005 9.5C5 14.8 12 21 12 21z"></path><circle cx="12" cy="9.5" r="2.5"></circle></svg>
      </button>
      <button style="flex: 1 1 0; height: 56px; border: 0; border-radius: 16px; background: #EAE7DE; display: flex; align-items: center; justify-content: center; gap: 8px; font: 700 16px Inter, system-ui, sans-serif; color: #17201B">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#17201B" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M9 5v14M15 5v14"></path></svg>Pause</button>
      <a href="SaveTrack.dc.html" style="flex: 1 1 0; height: 56px; border-radius: 16px; background: #B42318; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; font-weight: 700; color: #FFFFFF; text-decoration: none">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="#FFFFFF" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2"></rect></svg>Stop</a>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { yes: true };
  }
}
</script>
</body>
</html>
