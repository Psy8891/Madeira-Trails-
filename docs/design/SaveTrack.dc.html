<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Save hike</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#1F5F3F}a:hover{color:#174A31}
</style>
</helmet>
<div style="width: 390px; height: 1120px; position: relative; overflow: hidden; background: #F6F4EE; font-family: Inter, system-ui, sans-serif; color: #17201B">
  <header style="height: 64px; padding: 0 8px 0 4px; display: flex; align-items: center; gap: 4px; background: #FFFFFF; border-bottom: 1px solid #ECE9E1">
    <a href="Navigate.dc.html" aria-label="Back to recording" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#17201B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <h1 style="flex: 1 1 auto; margin: 0; font: 700 24px 'Barlow Semi Condensed', Inter, sans-serif">Save hike</h1>
    <button style="height: 40px; padding: 0 12px; border: 0; background: transparent; font: 600 14px Inter, system-ui, sans-serif; color: #B42318">Discard</button>
  </header>

  <div style="position: relative; height: 220px; overflow: hidden">
    <dc-import name="TopoMap" vb="-60 160 580 328" w="390" h="220" mode="track" me="{{no}}" hint-size="390px,220px"></dc-import>
    <span style="position: absolute; left: 12px; bottom: 12px; display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 13px; background: rgba(255,255,255,0.94); font-size: 12px; font-weight: 600"><span style="width: 14px; height: 3px; border-radius: 2px; background: #E4572E; display: block"></span>Your track <span style="width: 14px; height: 3px; border-radius: 2px; background: #2E9E5B; display: block; margin-left: 6px"></span>PR 6</span>
  </div>

  <main style="padding: 14px 16px 110px; display: flex; flex-direction: column; gap: 14px">
    <section aria-label="Hike summary" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; border-radius: 14px; overflow: hidden; background: #ECE9E1; border: 1px solid #ECE9E1">
      <div style="background: #FFFFFF; padding: 10px; display: flex; flex-direction: column"><span style="font: 700 19px 'Barlow Semi Condensed', Inter, sans-serif">8.5 km</span><span style="font-size: 11px; color: #4E5A53">Distance</span></div>
      <div style="background: #FFFFFF; padding: 10px; display: flex; flex-direction: column"><span style="font: 700 19px 'Barlow Semi Condensed', Inter, sans-serif">2:51</span><span style="font-size: 11px; color: #4E5A53">Moving</span></div>
      <div style="background: #FFFFFF; padding: 10px; display: flex; flex-direction: column"><span style="font: 700 19px 'Barlow Semi Condensed', Inter, sans-serif">3:24</span><span style="font-size: 11px; color: #4E5A53">Total</span></div>
      <div style="background: #FFFFFF; padding: 10px; display: flex; flex-direction: column"><span style="font: 700 19px 'Barlow Semi Condensed', Inter, sans-serif">↑ 268 m</span><span style="font-size: 11px; color: #4E5A53">Climb</span></div>
    </section>

    <label style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 13px; font-weight: 600; color: #3E4842">Name</span>
      <input type="text" value="Levada das 25 Fontes" style="height: 48px; padding: 0 14px; border: 1px solid #DDD8CC; border-radius: 12px; background: #FFFFFF; font: 500 15px Inter, system-ui, sans-serif; color: #17201B">
    </label>

    <section aria-label="Trim" style="display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <span style="font-size: 13px; font-weight: 600; color: #3E4842">Trim start and end</span>
        <span style="font-size: 12px; color: #4E5A53">Drag the ends to cut extra track</span>
      </div>
      <div style="position: relative; height: 32px">
        <div style="position: absolute; left: 0; right: 0; top: 14px; height: 4px; border-radius: 2px; background: #DDD8CC"></div>
        <div style="position: absolute; left: 4%; right: 2%; top: 14px; height: 4px; border-radius: 2px; background: #E4572E"></div>
        <button aria-label="Trim start" style="position: absolute; left: calc(4% - 12px); top: 4px; width: 24px; height: 24px; border-radius: 12px; border: 2px solid #E4572E; background: #FFFFFF; padding: 0"></button>
        <button aria-label="Trim end" style="position: absolute; right: calc(2% - 12px); top: 4px; width: 24px; height: 24px; border-radius: 12px; border: 2px solid #E4572E; background: #FFFFFF; padding: 0"></button>
      </div>
    </section>

    <section aria-label="Trail match" style="display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 16px; background: #E3F3EA">
      <div style="display: flex; gap: 10px; align-items: center">
        <span style="display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 8px; border: 1px solid #B9D9C5; border-radius: 6px; background: #FFFFFF; font: 700 13px 'Barlow Semi Condensed', Inter, sans-serif"><span style="display: inline-flex; flex-direction: column; width: 4px"><span style="height: 5px; background: #F2C200; display: block"></span><span style="height: 5px; background: #D32F2F; display: block"></span></span>PR 6</span>
        <span style="display: flex; flex-direction: column"><span style="font-size: 14.5px; font-weight: 700; color: #14532D">Matches Levada das 25 Fontes</span><span style="font-size: 12.5px; color: #1E4D33">94% of your track follows the official line</span></span>
      </div>
      <label style="display: flex; align-items: center; gap: 10px; min-height: 44px; font-size: 14.5px; font-weight: 600; color: #17201B">
        <input type="checkbox" checked style="width: 22px; height: 22px; accent-color: #1F5F3F; margin: 0">Mark PR 6 as done today</label>
      <label style="display: flex; align-items: center; gap: 10px; min-height: 44px; font-size: 14.5px; font-weight: 500; color: #17201B">
        <input type="checkbox" checked style="width: 22px; height: 22px; accent-color: #1F5F3F; margin: 0">Remove it from To-do</label>
    </section>

    <section aria-label="Rating" style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 13px; font-weight: 600; color: #3E4842">How was it? <span style="font-weight: 400; color: #4E5A53">(only you see this)</span></span>
      <div style="display: flex; gap: 4px">
        <button aria-label="1 star" style="width: 44px; height: 44px; border: 0; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center"><svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1 0.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-0.9z" fill="#E3A008"></path></svg></button>
        <button aria-label="2 stars" style="width: 44px; height: 44px; border: 0; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center"><svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1 0.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-0.9z" fill="#E3A008"></path></svg></button>
        <button aria-label="3 stars" style="width: 44px; height: 44px; border: 0; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center"><svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1 0.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-0.9z" fill="#E3A008"></path></svg></button>
        <button aria-label="4 stars" style="width: 44px; height: 44px; border: 0; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center"><svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1 0.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-0.9z" fill="#E3A008"></path></svg></button>
        <button aria-label="5 stars" style="width: 44px; height: 44px; border: 0; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center"><svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1 0.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-0.9z" fill="none" stroke="#B8B2A4" stroke-width="1.6"></path></svg></button>
      </div>
    </section>

    <label style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 13px; font-weight: 600; color: #3E4842">Private note</span>
      <textarea placeholder="Conditions, who you went with, what to remember" style="height: 88px; padding: 12px 14px; border: 1px solid #DDD8CC; border-radius: 12px; background: #FFFFFF; font: 400 15px Inter, system-ui, sans-serif; color: #17201B; resize: none"></textarea>
    </label>

    <button style="height: 56px; padding: 0 14px; border: 1px solid #DDD8CC; border-radius: 12px; background: #FFFFFF; display: flex; align-items: center; gap: 12px; font-family: Inter, system-ui, sans-serif; text-align: left">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4E5A53" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h7l2 2h9v11H3z"></path></svg>
      <span style="flex: 1 1 auto; display: flex; flex-direction: column"><span style="font-size: 12px; color: #4E5A53">Folder</span><span style="font-size: 15px; font-weight: 600; color: #17201B">Rabaçal walks</span></span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4E5A53" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
    </button>
  </main>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px 16px; background: #FFFFFF; border-top: 1px solid #E3E0D6">
    <a href="Me.dc.html" style="height: 54px; border-radius: 14px; background: #1F5F3F; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; color: #FFFFFF; text-decoration: none">Save hike</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1120}}'>
class Component extends DCLogic {
  renderVals() {
    return { no: false };
  }
}
</script>
</body>
</html>
